name: Сборка ЭХО Android APK (для BlueStacks и смартфонов)

   on:
     push:
       branches: [ "main", "master" ]
     workflow_dispatch:

   jobs:
     build-android:
       runs-on: ubuntu-latest

       steps:
         - name: 1. Загрузка исходного кода проекта
           uses: actions/checkout@v4

         - name: 2. Установка JDK 17
           uses: actions/setup-java@v4
           with:
             distribution: 'temurin'
             java-version: '17'

         - name: 3. Установка Android SDK и Gradle
           uses: gradle/actions/setup-gradle@v3
           with:
             gradle-version: '8.7'

         - name: 4. Сборка отладочного APK (Debug)
           run: |
             gradle assembleDebug --no-daemon

         - name: 5. Переименование APK для удобства
           run: |
             cp app/build/outputs/apk/debug/app-debug.apk echo-bluestacks-debug.apk

         - name: 6. Публикация готового APK для скачивания
           uses: actions/upload-artifact@v4
           with:
             name: echo-bluestacks-apk
             path: echo-bluestacks-debug.apk
             retention-days: 30
